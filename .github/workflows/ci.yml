name: CI

on:
  pull_request:
    branches: [main]
  push:
    # CI-CD.md S1 声明「向 feature 分支 push」亦触发；仅 main 会让门禁在开发分支静默。
    branches: ['**']

permissions:
  contents: read

jobs:
  checks:
    name: 静态检查 (S1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Markdown 规范检查
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            docs/**/*.md
            GLOSSARY.md
            skills/**/*.md
      - name: 技能解剖校验
        run: python scripts/validate_skill.py
      - name: 术语一致性校验
        run: python scripts/check_glossary.py
      - name: Token 预算 / 规范契约 / 产物上限检查 (S1)
        run: python scripts/check_token_budget.py --check
      - name: PR 正文 C4 产物上限 (S1)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/osai_pr_body.md
          python scripts/check_token_budget.py --artifact pr-body /tmp/osai_pr_body.md
      - name: 共享工具与新模块语法编译 (S1)
        run: python -m py_compile tools/collect_evidence.py tools/recon_ai/*.py tools/verify_evidence.py tools/attack_ai_agent/*.py report_exam/*.py scripts/*.py

  tests:
    name: 自动化测试 (S2)
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 运行测试
        run: python -m unittest discover -s tests -q
      - name: 行覆盖率门禁 (S2, ≥80%)
        run: python scripts/measure_coverage.py --target all --min 80

  build:
    name: 构建 (S3)
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 打包技能与治理产物
        run: |
          mkdir -p dist
          tar -czf dist/redteam-ai300-skills.tgz skills docs GLOSSARY.md
          (cd dist && sha256sum redteam-ai300-skills.tgz > redteam-ai300-skills.tgz.sha256)
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: redteam-ai300-skills
          path: dist/

  integration:
    name: 集成合规 (S4)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 全量技能合规
        run: python scripts/validate_skill.py
      - name: 全量术语一致性
        run: python scripts/check_glossary.py
      - name: Token 预算与规范契约复核 (S4)
        run: python scripts/check_token_budget.py --check

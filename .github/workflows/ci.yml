name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: 静态检查 (S1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Markdown 规范检查
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "docs/**/*.md,GLOSSARY.md,skills/**/*.md"
      - name: 技能解剖校验
        run: python scripts/validate_skill.py
      - name: 术语一致性校验
        run: python scripts/check_glossary.py

  tests:
    name: 自动化测试 (S2)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 运行测试
        run: python -m unittest discover -s tests -q

  build:
    name: 构建 (S3)
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包技能与治理产物
        run: |
          mkdir -p dist
          tar -czf dist/redteam-ai300-skills.tgz skills docs GLOSSARY.md
          (cd dist && sha256sum redteam-ai300-skills.tgz > redteam-ai300-skills.tgz.sha256)
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: redteam-ai300-skills
          path: dist/

  integration:
    name: 集成合规 (S4)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 全量技能合规
        run: python scripts/validate_skill.py
      - name: 全量术语一致性
        run: python scripts/check_glossary.py

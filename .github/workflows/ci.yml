name: CI

on:
  pull_request:
    branches: [main]
  push:
    # CI-CD.md S1 声明「向 feature 分支 push」亦触发；仅 main 会让门禁在开发分支静默。
    branches: ['**']

  # 三层隔离 ②：main 级串行合并（ADR「三层隔离」）。
  # merge_group 使合并队列中的 PR 先按「预合并结果」跑门禁，失败不进入 main，
  # 从机制上消除「两个 PR 各自绿、合并后冲突/超限」这类并发合并风险。
  merge_group:
    types: [checks_requested]

  # 手动审计入口：dry_run=true 时所有清理步骤仅报告范围、不实际删除。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅报告清理范围，不实际删除（true/false）'
        required: false
        default: false
        type: boolean

# 自动触发规则：清理接线在每个作业首尾执行，post 以 if: always() 覆盖
# success / failure / cancelled 三种结束状态；手动 dispatch 时按 dry_run 切换。
env:
  CI_CLEANUP_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'dry-run' || 'apply' }}

permissions:
  contents: read

# 三层隔离 ②：串行合并（main 级）。同一 group 的并发运行互相取消，
# 保证 main 上的门禁（尤其 S3/S4）串行执行，避免并发写入 dist/ 与共享产物。
concurrency:
  group: ci-main-serial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 静态检查 (S1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 阶段前清理 (pre)
        uses: ./.github/actions/ci-cleanup
        with:
          phase: pre
          mode: ${{ env.CI_CLEANUP_MODE }}
      - name: Markdown 规范检查
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: |
            docs/**/*.md
            GLOSSARY.md
            skills/**/*.md
      - name: 技能解剖校验
        run: python scripts/validate_skill.py
      - name: 术语一致性校验
        run: python scripts/check_glossary.py
      - name: Token 预算 / 规范契约 / 产物上限检查 (S1)
        run: python scripts/check_token_budget.py --check
      - name: PR 正文 C4 产物上限 (S1)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/osai_pr_body.md
          python scripts/check_token_budget.py --artifact pr-body /tmp/osai_pr_body.md
      - name: 契约清单完整性校验 (S1)
        run: python scripts/check_contract_manifest.py --check
      - name: 契约消费者依赖断言 (S1)
        run: python scripts/check_contract_consumers.py --check
      - name: 契约 PR 变更清单门禁 (S1)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/osai_pr_body.md
          git fetch --depth=1 origin "$BASE_SHA" || true
          CHANGED="$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || true)"
          python scripts/check_contract_manifest.py --pr-body /tmp/osai_pr_body.md --changed $CHANGED
      - name: 显式清单语法编译 (S1)
        # 编译范围唯一来源 scripts/tools_manifest.json；补齐原遗漏 5 包 + 10 脚本。
        # 独立步骤，不与并发会话共用长行（ADR-0006 去冲突约定）。
        run: python scripts/check_tools_compile.py
      - name: PyRIT 版本漂移与调用点映射门禁 (S1)
        # 独立步骤，不与并发会话共用长行；离线夹具，不依赖真实 pyrit 安装。
        run: python -m tools.pyrit_compat.checker check --root . --target 1.2.1
      - name: EvidenceWriter 契约符合性 (S1)
        # 4 份适配器最小契约静态校验（tools/_evidence_contract.py）
        run: python scripts/check_evidence_contract.py
      - name: 考试就绪证据链发现 (S1)
        # 独立步骤；只读报告缺口，不在 CI 阻断（真实证据须考试窗口落盘）
        run: python tools/evidence_pipeline.py --target-map docs/operations/osai-target-map.md --root . --report-only
      - name: 主线留痕与影子规格发现 (S1)
        # 独立步骤；只报告，不改并发会话共用长行
        run: python scripts/validate_skill_mainline.py --root .
      - name: 阶段后清理 (post, always)
        if: always()
        uses: ./.github/actions/ci-cleanup
        with:
          phase: post
          status: ${{ job.status }}
          mode: ${{ env.CI_CLEANUP_MODE }}
          # S1 生成的 PR 正文临时文件（契约门禁步骤写入 /tmp）
          temp-root: /tmp
          temp-targets: /tmp/osai_pr_body.md

  tests:
    name: 自动化测试 (S2)
    needs: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 阶段前清理 (pre)
        uses: ./.github/actions/ci-cleanup
        with:
          phase: pre
          mode: ${{ env.CI_CLEANUP_MODE }}
      - name: 运行测试
        # tests 按 skill 分组后必须指定 top-level 为仓库根，模块名 tests.<group>.test_*。
        run: python -m unittest discover -s tests -t . -q
      - name: 行覆盖率门禁 (S2, ≥80%)
        run: python scripts/measure_coverage.py --target all --min 80
      - name: 阶段后清理 (post, always)
        if: always()
        uses: ./.github/actions/ci-cleanup
        with:
          phase: post
          status: ${{ job.status }}
          mode: ${{ env.CI_CLEANUP_MODE }}

  build:
    name: 构建 (S3)
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: 阶段前清理 (pre)
        uses: ./.github/actions/ci-cleanup
        with:
          phase: pre
          mode: ${{ env.CI_CLEANUP_MODE }}
      - name: 打包技能与治理产物
        run: |
          mkdir -p dist
          tar -czf dist/redteam-ai300-skills.tgz skills docs GLOSSARY.md
          (cd dist && sha256sum redteam-ai300-skills.tgz > redteam-ai300-skills.tgz.sha256)
      - name: 交付物存在性断言 (keep-only)
        # 上传前先确认交付物齐全；keep-only 不因缓存残留误判，且清理器不会删 dist。
        run: python3 scripts/ci_cleanup.py verify --keep-only --keep dist/redteam-ai300-skills.tgz --keep dist/redteam-ai300-skills.tgz.sha256
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: redteam-ai300-skills
          path: dist/
      - name: 清理已上传的本地构建产物 (clean-dist)
        # 仅在上传成功后执行（无 if: always），避免失败时误删尚未上传的唯一副本。
        uses: ./.github/actions/ci-cleanup
        with:
          phase: post
          status: ${{ job.status }}
          mode: ${{ env.CI_CLEANUP_MODE }}
          clean-dist: 'true'
      - name: 阶段后清理 (post, always)
        if: always()
        uses: ./.github/actions/ci-cleanup
        with:
          phase: post
          status: ${{ job.status }}
          mode: ${{ env.CI_CLEANUP_MODE }}

  integration:
    name: 集成合规 (S4)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: 阶段前清理 (pre)
        uses: ./.github/actions/ci-cleanup
        with:
          phase: pre
          mode: ${{ env.CI_CLEANUP_MODE }}
      - name: 全量技能合规
        run: python scripts/validate_skill.py
      - name: 全量术语一致性
        run: python scripts/check_glossary.py
      - name: Token 预算与规范契约复核 (S4)
        run: python scripts/check_token_budget.py --check
      - name: 阶段后清理 (post, always)
        if: always()
        uses: ./.github/actions/ci-cleanup
        with:
          phase: post
          status: ${{ job.status }}
          mode: ${{ env.CI_CLEANUP_MODE }}

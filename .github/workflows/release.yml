name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 部署/发布 (S5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 发布前最终门禁
        run: |
          python scripts/validate_skill.py
          python scripts/check_glossary.py
      - name: 运行测试
        run: python -m unittest discover -s tests -q
      - name: 打包产物
        run: |
          mkdir -p dist
          tar -czf dist/redteam-ai300-skills.tgz skills docs GLOSSARY.md
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/redteam-ai300-skills.tgz
          generate_release_notes: true
